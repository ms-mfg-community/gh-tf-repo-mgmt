name: Terraform Plan

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: prd

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v1
        with:
          terraform_version: 1.0.0

      - name: Azure login
        uses: azure/login@v2
        with:
            client-id: ${{ secrets.CLIENT_ID}}
            tenant-id: ${{ secrets.TENANT_ID }}
            subscription-id: ${{ secrets.SUB1_ID }}

      - name: Set TF Environment Variables
        run: | 
            echo "ARM_CLIENT_ID=${{ secrets.CLIENT_ID }}" >> $GITHUB_ENV
            echo "ARM_SUBSCRIPTION_ID=${{ secrets.SUB1_ID }}" >> $GITHUB_ENV
            echo "ARM_TENANT_ID=${{ secrets.TENANT_ID }}" >> $GITHUB_ENV
            echo "ARM_USE_OIDC=true" >> $GITHUB_ENV

      - name: Terraform Init
        run: terraform init -backend-config=parameters/azure.backend.tfbackend

      - name: Terraform Plan
        run: terraform plan -var-file=parameters/repos.dev.tfvars -out=tfplan

      - name: Save Plan Output
        run: terraform show -json tfplan > tfplan.json

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v2
        with:
          name: tfplan
          path: tfplan.json